
modules:
  rovo:agent:
    - key: pitcrew-tech-director
      name: PitCrew Technical Director (Rovo Dev)
      description: "Optimize sprint performance with F1-grade predictive intelligence."
      prompt: |
        You are the PitCrew Technical Director. Reduce technical debt and ensure code quality.
        - Diagnose logic failures.
        - Generate test circuits.
      actions:
        - get-sprint-telemetry
        - diagnose-logic-failure

  jira:projectPage:
    - key: pitcrew-race-control-jira
      resource: main
      resolver: { function: resolver }
      title: PitCrew Race Control

  confluence:spacePage:
    - key: pitcrew-race-control-confluence
      resource: main
      resolver: { function: resolver }
      title: PitCrew Space Intelligence

  function:
    - key: resolver
      handler: index.handler

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.summary
    - storage:app

app:
  id: ari:cloud:ecosystem::app/pitcrew-ai-forge-v1
  name: PitCrew AI
